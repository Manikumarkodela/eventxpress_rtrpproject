<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Vendors | EventXpress</title>
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Oleo+Script+Swash+Caps&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/a39f2ce48a.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
    <style>
        .vendors-page {
            min-height: 100vh;
        }
    </style>
</head>
<body>

<nav class="navbar" aria-label="Primary navigation">
    <div class="nav-container">
        <div class="nav-left">
            <a href="index.html" class="logo">eventXpress</a>
        </div>
        <div class="nav-center" id="navCenter">
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li class="dropdown">
                    <button type="button" class="dropdown-toggle" aria-expanded="false">
                        Services
                        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a href="#">Photographers</a></li>
                        <li><a href="#">Caterers</a></li>
                        <li><a href="#">Decorators</a></li>
                        <li><a href="#">Venues</a></li>
                    </ul>
                </li>
                <li class="dropdown">
                    <button type="button" class="dropdown-toggle" aria-expanded="false">
                        Categories
                        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a href="#">Wedding Planning</a></li>
                        <li><a href="#">Birthday Events</a></li>
                        <li><a href="#">Corporate Events</a></li>
                    </ul>
                </li>
                <li class="dropdown">
                    <button type="button" class="dropdown-toggle" aria-expanded="false">
                        Locations
                        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a href="#">Hyderabad</a></li>
                        <li><a href="#">Warangal</a></li>
                    </ul>
                </li>
                <li><a href="#blog">Blog</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <div class="search-box" role="search">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input type="text" placeholder="Search services..." aria-label="Search services">
            </div>
            <div id="auth-buttons">
                <button class="btn-primary login-btn" onclick="window.location.href='login.html'">Login</button>
            </div>

            <div id="user-menu" class="user-menu" aria-haspopup="true" style="display: none;">
                <button id="user-trigger" class="user-trigger" aria-expanded="false">
                    <i class="fa-solid fa-circle-user"></i>
                    <span id="user-name">User</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>

                <div id="user-dropdown" class="user-dropdown">
                </div>
            </div>

            <!-- MENU TOGGLE -->
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</nav>

<main class="vendors-page">
    <section class="vendors" aria-label="All vendors">
        <div class="vendor-heading-row">
            <div>
                <h2>All Vendors</h2>
                <p class="subtitle">Handpicked vendors with the best reviews</p>
            </div>
        </div>

        <div class="vendor-filters">
            <input type="text" id="searchInput" placeholder="Search vendors..." />
            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Photography">Photography</option>
                <option value="Catering">Catering</option>
                <option value="Decoration">Decoration</option>
                <option value="Makeup & Beauty">Makeup & Beauty</option>
                <option value="Venue">Venue</option>
            </select>
            <select id="locationFilter">
                <option value="">All Locations</option>
                <option value="New York City">New York City</option>
                <option value="Chicago">Chicago</option>
                <option value="San Francisco">San Francisco</option>
                <option value="Los Angeles">Los Angeles</option>
            </select>
        </div>

        <div class="vendor-grid" id="vendor-grid"></div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
